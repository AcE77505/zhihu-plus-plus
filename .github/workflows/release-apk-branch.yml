# ⚠️ 临时文件：仅用于在 copilot/modify-login-page-useragent 分支上产出 release APK。
# 用途：push 到该分支时自动编译 full / lite 的 release 变体并上传 artifact。
# 产物位置：Actions → 本次 run → 页面底部 Artifacts → zhihu++-release-apks-<run_number>
# 下载完 APK 后可以直接删除本文件，不影响其他流程。
name: Temp Build Release APK (copilot branch)

on:
  push:
    branches:
      - copilot/modify-login-page-useragent
  workflow_dispatch:

concurrency:
  group: temp-release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build full/lite release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          override: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./rs-hf-tokenizer/target/
          key: temp-rust-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            temp-rust-cache-
            rust-cache-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认的 tools 包已无法安装，见 upstream 记录
          packages: platform-tools

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # app/build.gradle.kts 只在环境变量 signingKey 存在时才给 release 签名，
      # 所以这里先判断仓库是否配置了签名 secret：有就用它，没有就现场生成一个临时 keystore。
      - name: Resolve signing material
        id: signing
        env:
          SECRET_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SECRET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${SECRET_ANDROID_SIGNING_KEY}" ]]; then
            echo "mode=repository-secret" >> "$GITHUB_OUTPUT"
            {
              echo "signingKey=${SECRET_ANDROID_SIGNING_KEY}"
              echo "keyAlias=${SECRET_ANDROID_KEY_ALIAS}"
              echo "keyStorePassword=${SECRET_ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${SECRET_ANDROID_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "- 签名方式：仓库 secret（与官方发布同签名）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=temp-keystore" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/zhihu-ci-temp.p12" \
              -storetype PKCS12 \
              -alias zhihu-ci-temp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass zhihuplusplus -keypass zhihuplusplus \
              -dname "CN=Zhihu++ Temporary CI, OU=CI, O=Zhihu++, L=Tianjin, ST=Tianjin, C=CN"
            {
              echo "signingKey=$(base64 -w0 "$RUNNER_TEMP/zhihu-ci-temp.p12")"
              echo "keyAlias=zhihu-ci-temp"
              echo "keyStorePassword=zhihuplusplus"
              echo "keyPassword=zhihuplusplus"
            } >> "$GITHUB_ENV"
            echo "- 签名方式：CI 临时 keystore（未检测到 ANDROID_SIGNING_KEY）" >> "$GITHUB_STEP_SUMMARY"
            echo "- ⚠️ 与官方签名不同，安装前需先卸载已安装的官方版本" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APKs
        run: |
          set -euo pipefail
          bash ./gradlew assembleFullRelease assembleLiteRelease --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p app/build/upload
          full_apk="$(find app/build/outputs/apk/full/release -maxdepth 1 -name '*.apk' | head -n 1)"
          lite_apk="$(find app/build/outputs/apk/lite/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$full_apk"
          test -n "$lite_apk"
          cp "$full_apk" app/build/upload/zhihu++-full-release.apk
          cp "$lite_apk" app/build/upload/zhihu++-lite-release.apk
          cd app/build/upload
          sha256sum ./*.apk | tee SHA256SUMS.txt
          {
            echo "- 版本：$(grep '^app.versionName=' ../../../gradle.properties | cut -d= -f2) (versionCode $(grep '^app.versionCode=' ../../../gradle.properties | cut -d= -f2))"
            echo "- 提交：\`${{ github.sha }}\`"
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: zhihu++-release-apks-${{ github.run_number }}
          path: app/build/upload/
          if-no-files-found: error
          retention-days: 14
